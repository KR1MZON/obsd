# Site Statistics Configuration
# This file contains all statistical data displayed across the website
# All statistics are centralized here to avoid duplications

# Core Statistics - Single source of truth
core_stats:
  robots_built:
    value: "Dynamic"
    use_robot_count: true
    display_suffix: "+"
    description: "Custom-designed combat robots"
  
  championships:
    value: 25
    display_suffix: "+"
    description: "Tournament victories worldwide"
  
  competitions:
    value: 100
    display_suffix: "+"
    description: "Battles fought and won"
  
  team_members:
    value: "Dynamic"
    use_team_count: true
    display_suffix: ""
    description: "Skilled engineers and builders"
  
  years_experience:
    value: 50
    display_suffix: "+"
    description: "Years of combined team experience"
  
  projects_completed:
    value: 25
    display_suffix: "+"
    description: "Successful robot builds and modifications"
  
  innovations_created:
    value: 100
    display_suffix: "+"
    description: "Unique solutions and improvements"

# About Section Statistics (Achievement Cards)
about_achievements:
  - icon: "FaRocket"
    stat_key: "robots_built"
    label: "Robots Built"
  - icon: "FaTrophy"
    stat_key: "championships"
    label: "Championships"
  - icon: "FaCog"
    stat_key: "competitions"
    label: "Competitions"
  - icon: "FaUsers"
    stat_key: "team_members"
    label: "Team Members"

# Team Section Statistics
team_stats:
  - icon: "FaUsers"
    stat_key: "team_members"
    label: "Team Members"
  - icon: "FaCog"
    stat_key: "years_experience"
    label: "Years Combined Experience"
  - icon: "FaRocket"
    stat_key: "projects_completed"
    label: "Projects Completed"
  - icon: "FaLightbulb"
    stat_key: "innovations_created"
    label: "Innovations Created"

# Hero Section Statistics (Quick Stats)
hero_stats:
  - icon: "FaRocket"
    stat_key: "robots_built"
    label: "Robots Built"
  - icon: "FaTrophy"
    stat_key: "championships"
    label: "Championships"
  - icon: "FaCog"
    stat_key: "competitions"
    label: "Competitions"