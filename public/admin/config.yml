backend:
  name: git-gateway
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "team-members"
    label: "Team Members"
    folder: "content/team-members"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Name", name: "name", widget: "string"}
      - {label: "Role", name: "role", widget: "string"}
      - {label: "Photo", name: "photo", widget: "image"}
      - {label: "Join Date", name: "joinDate", widget: "date"}
      - {label: "Social Links", name: "socialLinks", widget: "object", fields: [
          {label: "Twitter", name: "twitter", widget: "string", required: false},
          {label: "LinkedIn", name: "linkedin", widget: "string", required: false},
          {label: "GitHub", name: "github", widget: "string", required: false}
        ]}

  - name: "robots"
    label: "Robots"
    folder: "content/robots"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Robot Name", name: "name", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Weight Class", name: "weightClass", widget: "string"}
      - {label: "Weapon Type", name: "weaponType", widget: "string"}
      - {label: "Competition Record", name: "record", widget: "text"}
      - {label: "Images", name: "images", widget: "list", field: {label: "Image", name: "image", widget: "image"}}
      - {label: "Build Date", name: "buildDate", widget: "date"}
      - {label: "Status", name: "status", widget: "select", options: ["active", "retired"]}

  - name: "achievements"
    label: "Achievements"
    folder: "content/achievements"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Date", name: "date", widget: "date"}
      - {label: "Competition Name", name: "competition", widget: "string"}
      - {label: "Image", name: "image", widget: "image", required: false}
      - {label: "Award Type", name: "awardType", widget: "select", options: ["Tournament Win", "Design Award", "Other"]}

  - name: "sponsors"
    label: "Sponsors"
    folder: "content/sponsors"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Image", name: "image", widget: "image", required: false, media_folder: "/uploads/SPONSORS"}
      - {label: "Website URL", name: "website", widget: "string", required: false}

  - name: "settings"
    label: "Site Settings"
    files:
      - label: "General Settings"
        name: "general"
        file: "content/settings/general.yml"
        fields:
          - {label: "Team Name", name: "teamName", widget: "string"}
          - {label: "Tagline", name: "tagline", widget: "string"}
          - {label: "About Text", name: "about", widget: "markdown"}
          - {label: "Contact Email", name: "contactEmail", widget: "string"}
          - {label: "Phone", name: "phone", widget: "string"}
          - {label: "Address", name: "address", widget: "text"}
          - {label: "Social Media", name: "socialMedia", widget: "object", fields: [
              {label: "Facebook", name: "facebook", widget: "string", required: false},
              {label: "Twitter", name: "twitter", widget: "string", required: false},
              {label: "Instagram", name: "instagram", widget: "string", required: false},
              {label: "YouTube", name: "youtube", widget: "string", required: false}
            ]}
      - label: "Statistics"
        name: "statistics"
        file: "content/settings/statistics.yml"
        fields:
          - {label: "Core Statistics", name: "core_stats", widget: "object", fields: [
              {label: "Robots Built", name: "robots_built", widget: "object", fields: [
                {label: "Value", name: "value", widget: "string", default: "Dynamic"},
                {label: "Use Robot Count", name: "use_robot_count", widget: "boolean", default: true},
                {label: "Display Suffix", name: "display_suffix", widget: "string", default: "+"},
                {label: "Description", name: "description", widget: "string"}
              ]},
              {label: "Championships", name: "championships", widget: "object", fields: [
                {label: "Value", name: "value", widget: "number", value_type: "int"},
                {label: "Display Suffix", name: "display_suffix", widget: "string", default: "+"},
                {label: "Description", name: "description", widget: "string"}
              ]},
              {label: "Competitions", name: "competitions", widget: "object", fields: [
                {label: "Value", name: "value", widget: "number", value_type: "int"},
                {label: "Display Suffix", name: "display_suffix", widget: "string", default: "+"},
                {label: "Description", name: "description", widget: "string"}
              ]},
              {label: "Team Members", name: "team_members", widget: "object", fields: [
                {label: "Value", name: "value", widget: "string", default: "Dynamic"},
                {label: "Use Team Count", name: "use_team_count", widget: "boolean", default: true},
                {label: "Display Suffix", name: "display_suffix", widget: "string", default: ""},
                {label: "Description", name: "description", widget: "string"}
              ]},
              {label: "Years Experience", name: "years_experience", widget: "object", fields: [
                {label: "Value", name: "value", widget: "number", value_type: "int"},
                {label: "Display Suffix", name: "display_suffix", widget: "string", default: "+"},
                {label: "Description", name: "description", widget: "string"}
              ]},
              {label: "Projects Completed", name: "projects_completed", widget: "object", fields: [
                {label: "Value", name: "value", widget: "number", value_type: "int"},
                {label: "Display Suffix", name: "display_suffix", widget: "string", default: "+"},
                {label: "Description", name: "description", widget: "string"}
              ]},
              {label: "Innovations Created", name: "innovations_created", widget: "object", fields: [
                {label: "Value", name: "value", widget: "number", value_type: "int"},
                {label: "Display Suffix", name: "display_suffix", widget: "string", default: "+"},
                {label: "Description", name: "description", widget: "string"}
              ]}
            ]}
          - {label: "About Section Statistics", name: "about_achievements", widget: "list", fields: [
              {label: "Icon", name: "icon", widget: "select", options: ["FaRocket", "FaTrophy", "FaCog", "FaUsers", "FaLightbulb"]},
              {label: "Stat Key", name: "stat_key", widget: "select", options: ["robots_built", "championships", "competitions", "team_members", "years_experience", "projects_completed", "innovations_created"]},
              {label: "Label", name: "label", widget: "string"}
            ]}
          - {label: "Team Section Statistics", name: "team_stats", widget: "list", fields: [
              {label: "Icon", name: "icon", widget: "select", options: ["FaRocket", "FaTrophy", "FaCog", "FaUsers", "FaLightbulb"]},
              {label: "Stat Key", name: "stat_key", widget: "select", options: ["robots_built", "championships", "competitions", "team_members", "years_experience", "projects_completed", "innovations_created"]},
              {label: "Label", name: "label", widget: "string"}
            ]}
          - {label: "Hero Section Statistics", name: "hero_stats", widget: "list", fields: [
              {label: "Icon", name: "icon", widget: "select", options: ["FaRocket", "FaTrophy", "FaCog", "FaUsers", "FaLightbulb"]},
              {label: "Stat Key", name: "stat_key", widget: "select", options: ["robots_built", "championships", "competitions", "team_members", "years_experience", "projects_completed", "innovations_created"]},
              {label: "Label", name: "label", widget: "string"}
            ]}
